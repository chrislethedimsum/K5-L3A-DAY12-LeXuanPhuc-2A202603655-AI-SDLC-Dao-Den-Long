name: CI Verification (Contract v1.3)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/collect-proof.mjs
      - run: npm run soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-v13-proof
          path: docs/proof/
