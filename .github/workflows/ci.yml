name: Phase 1 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/collect-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-proof
          path: docs/proof/
